<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/train-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RailTogether - Keep Your Journey Together</title>
    <meta name="description" content="Intelligent assistive seat-splitting coordinator for families and groups travelling on Indian Railways." />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-coal-950 dark:text-coal-100 antialiased font-sans min-h-screen transition-colors duration-300">
    <div id="root"></div>
      <script type="module" src="/src/main.jsx"></script>
    <script>
      // Apply persisted theme before first paint to avoid a flash of light mode
      (function () {
        try {
          var t = localStorage.getItem('railtogether_theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </body>
</html>
